version: "3.9"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    image: ghcr.io/webdesign-ladisch/videoplatform-backend:latest
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      UPLOAD_ROOT: /uploads
      NODE_ENV: production
    volumes:
      - uploads:/uploads
    restart: unless-stopped

  frontend:
    image: ghcr.io/webdesign-ladisch/videoplatform-frontend:latest
    env_file: .env
    environment:
      VITE_API_BASE: ${VITE_API_BASE}
    restart: unless-stopped

volumes:
  uploads:
  pgdata:
